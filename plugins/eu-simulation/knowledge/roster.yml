# SYNCED COPY — do not edit. Canonical: knowledge/roster.yml — edit there, then run scripts/sync-shared-references.sh

# College of Commissioners, 2024–2029 term: machine-readable roster.
#
# Single source for portfolio ids, titles, ranks, shortname aliases, EVP
# steering and the College voting rule. Persona content lives in
# knowledge/commissioners/<id>.md; each file's YAML header repeats its id, rank
# and title, and scripts/validate.sh fails if the two disagree.
#
# Portfolios, never people: the simulation speaks as the portfolio and never
# names the Member who holds it.
#
# Facts are model knowledge to mid-2026, not checked against live sources.
# Verify titles and steering against the President's mission letters of
# 17 September 2024 and commission.europa.eu before relying on them.

as_of: 2026-11-17
verified: false
term:
  start: 2024-12-01
  end: 2029-10-31

college:
  members: 27
  # Art. 17(4)-(5) TEU: one national of each Member State, President and
  # High Representative included.
  quorum: 14            # majority of Members, Art. 12(1) Rules of Procedure
  majority: 14          # majority of all Members, Art. 250 TFEU; Art. 13(1) and (2)(d) Rules of Procedure
  vote: "One vote per Member, not delegable (Art. 13(2)(c) Rules of Procedure). The College aims for consensus; formal votes are rare."
  rules_of_procedure: "Commission Decision (EU) 2024/3080 [EUR-Lex — verify current version]"

# Speaking order used by the simulation: President, High Representative,
# Executive Vice-Presidents, then Commissioners. It is not the official order
# of precedence (Art. 3(5) Rules of Procedure).
#
# rank:   president | hrvp | evp | commissioner
# steers: portfolios an Executive Vice-President coordinates [model knowledge — verify].
#         A Commissioner may be steered by more than one EVP on different files.
# aliases: other shortnames accepted by /commissioner, including the ids of the
#         21 generic portfolios this roster replaced.

portfolios:
  - id: president
    rank: president
    title: "President of the European Commission"
    aliases: []
    steers: []
    # Guides the whole College (Art. 17(6) TEU); listed empty so every
    # steers value is a list.

  - id: high-representative
    rank: hrvp
    title: "High Representative of the Union for Foreign Affairs and Security Policy / Vice-President"
    aliases: [foreign-policy, hrvp, foreign-affairs]
    steers: [enlargement, mediterranean, international-partnerships, defence-space, preparedness]

  - id: clean-transition
    rank: evp
    title: "Executive Vice-President for a Clean, Just and Competitive Transition"
    aliases: [green-deal, competition]
    steers: [climate, energy, environment]

  - id: tech-sovereignty
    rank: evp
    title: "Executive Vice-President for Tech Sovereignty, Security and Democracy"
    aliases: [digital]
    steers: [defence-space, internal-affairs, justice, research-innovation]

  - id: industrial-strategy
    rank: evp
    title: "Executive Vice-President for Prosperity and Industrial Strategy"
