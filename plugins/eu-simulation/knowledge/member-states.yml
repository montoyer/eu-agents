# SYNCED COPY — do not edit. Canonical: knowledge/member-states.yml — edit there, then run scripts/sync-shared-references.sh

# Member States of the EU: machine-readable data for Council arithmetic.
#
# Single source for the population figures used in qualified majority voting,
# the seats each Member State holds in the European Parliament, euro-area
# membership and the order of Council presidencies. Skills that count votes
# read this file; scripts/validate.sh checks its totals.
#
# Population: Annex III to the Council's Rules of Procedure, which the Council
# replaces each year with effect from 1 January (Art. 11(6) of its Rules of
# Procedure), on Eurostat data held on 30 September of the year before. Update
# this block when the next decision is published in the Official Journal.

as_of: 2026-11-17
verified: true

population:
  source: "Council Decision (EU, Euratom) 2025/2427 of 17 November 2025, OJ L, 27.11.2025 [EUR-Lex — verify current version]"
  applies_from: 2026-01-01
  applies_to: 2026-12-31
  total: 452162974
  qmv_threshold: 293905933    # 65 % of the total, as Annex III states it
  blocking_above: 158257041   # states not voting in favour must exceed this to block (35 %)

ep_seats_source: "European Council Decision (EU) 2023/2061, 2024–2029 term, 720 seats"
euro_source: "21 members from 1 January 2026, when Bulgaria joined [model knowledge — verify]"
presidency_source: "Council Decision (EU) 2016/1316, order to 31 December 2030"

